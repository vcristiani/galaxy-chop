[project]
name = "galaxychop"
version = "0.3.dev0"
authors = [
    { name = "Valeria Cristiani et al", email = "valeria.cristiani@unc.edu.ar" },
]
readme = "README.md"
license = { file = "LICENSE.txt" }
description = "Galaxy dynamic de-composition"
keywords = ["galaxy", "dynamics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

urls = { "Homepage" = "https://github.com/vcristiani/galaxy-chop", "Repository" = "https://github.com/vcristiani/galaxy-chop" }

dependencies = [
    # --- Core ---
    "scipy >= 1.0",
    "scikit-learn < 1.7",
    "uttrs",
    "h5py",
    "custom_inherit",
    "grispy",
    "joblib",
    "typer >= 0.9.0",

    # --- Astropy ---
    "astropy >= 6; python_version >= '3.10'",
    "astropy < 6,>=5.3; python_version < '3.10'",

    # --- Seaborn y matplotlib ---
    "seaborn >= 0.12, < 0.13; python_version < '3.10'",
    "matplotlib >= 3.6, < 3.8; python_version < '3.10'",

    "seaborn >= 0.12; python_version >= '3.10'",
    "matplotlib >= 3.8; python_version >= '3.10'",

    # --- Numpy ---
    "numpy >= 1.22, <= 1.24.4; python_version < '3.10'",
    "numpy >= 2.0; python_version >= '3.10'",

    # --- Pandas ---
    "pandas >= 1.3, <= 1.5.3; python_version < '3.10'",
    "pandas >= 2.0; python_version >= '3.10'",

    # --- Numba ---
    "numba >= 0.55, < 0.59; python_version < '3.10'",
    "numba >= 0.59; python_version >= '3.10'",
]

[project.scripts]
galaxychop = "galaxychop.cli:main"



[tool.black]
line-length = 79
target-version = ["py310", "py311", "py312", "py313"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "plot: marks tests as part of the integration with matplotlib slow (deselect with '-m \"not plots\"')",
    "model: marks tests as part model decomposition API (deselect with '-m \"not model\"')",
]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "package.__version__" }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["galaxychop", "galaxychop.*"]
namespaces = false

[tool.basedpyright]
reportUnknownVariableType = false
reportMissingParameterType = false

[tool.pyright]
reportMissingParameterType = false
