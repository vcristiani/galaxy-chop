# ==============================================================
# CI with GitHub Actions
# ==============================================================

# Reusable workflow with every tox environment. It is called by CI.yml
# (on every push and pull request) and by publish.yml (before a release).

name: Testing

on:
  workflow_call:

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:

      # continues even if an environment fails
      fail-fast: false

      matrix:

        # all the tox with the default python version
        py_version: ["3.11"]
        tox_env:
          - style
          - docstyle
          - check-testdir
          - check-headers
          - check-apidocsdir
          - make-docs
          - coverage

        # check version by version
        include:
          - py_version: "3.11"
            tox_env: py311
          - py_version: "3.12"
            tox_env: py312
          - py_version: "3.13"
            tox_env: py313
          - py_version: "3.14"
            tox_env: py314
          - py_version: "3.15"
            tox_env: py315

    # the steps of the CI
    steps:
      - uses: actions/checkout@v4

      # optionals
      - name: Install pandoc  # nbsphinx needs it to render the tutorials
        if: ${{ matrix.tox_env == 'make-docs' }}
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # h5py has no python 3.15 wheels yet, so pip builds it from source
      # and needs the HDF5 library
      - name: Install HDF5
        if: ${{ matrix.tox_env == 'py315' }}
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev pkg-config

      # coverage runs on python 3.12 (tox.ini basepython)
      - name: Set up Python 3.12 for coverage
        if: ${{ matrix.tox_env == 'coverage' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tox steps
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py_version }}
          allow-prereleases: true
      - name: Install tox
        run: pip install tox
      - name: tox -e ${{ matrix.tox_env }}
        run: tox -re ${{ matrix.tox_env }}
