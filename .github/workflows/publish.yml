# ==============================================================
# CI with GitHub Actions
# ==============================================================

# Builds the sdist and the (pure python) wheel and uploads them to PyPI
# when a GitHub release is published. Needs the PYPI_API_TOKEN secret: an
# API token created in pypi.org for the galaxychop project.

name: PyPI publish

on:
  release:
    types: [published]

jobs:
  testing:
    uses: ./.github/workflows/tests.yml

  build:
    needs: testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  pypi-upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
