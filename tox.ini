# =============================================================================
# TOX CONFIGURATION FILE
# =============================================================================
# This file configures tox to automate testing, linting, documentation
# and code quality checks for the galaxychop project.
#
# Place this file in the same directory as pyproject.toml and run 'tox'
#
# Basic usage:
#   tox                    # Run all environments
#   tox -e py311           # Run only Python 3.11 tests
#   tox -e style           # Run only style checks
#   tox -m static          # Run only environments with 'static' label
#   tox -m dynamic         # Run only environments with 'dynamic' label
#   tox -m docs            # Run only documentation environments
# =============================================================================

[tox]
envlist =
    # Static code verification
    style,
    docstyle,

    # Dynamic structure verification
    check-testdir,
    check-headers,
    check-apidocsdir,

    # Documentation generation
    make-docs,

    # Tests across different Python versions
    py310,
    py311,
    py312,
    py313,

    # Test coverage analysis
    coverage

# =============================================================================
# DYNAMIC TEST ENVIRONMENTS (label: dynamic)
# =============================================================================
# These environments run tests and checks that require package installation
# and may modify system state.

[testenv]
description = "Run unit tests with pytest"
labels = dynamic
usedevelop = True
deps =
    ipdb          # Interactive debugger
    pytest        # Testing framework
commands =
    pytest tests/ {posargs}

[testenv:coverage]
description = "Run tests with coverage analysis (minimum 90%)"
basepython = python3.12  # Use Python 3.12 for coverage analysis
deps =
    {[testenv]deps}
    coverage
    pytest-cov
usedevelop = True
commands =
    pip install -r requirements_dev.txt
    - coverage erase
    pytest -v tests/ --cov galaxychop --cov-fail-under 90 --cov-report term-missing

# =============================================================================
# STATIC CODE ANALYSIS ENVIRONMENTS (label: static)
# =============================================================================
# These environments perform static analysis without installing the package
# or executing the code.

[testenv:style]
description = "Check code style with flake8"
labels = static
skip_install = True
usedevelop = False
deps =
    flake8                # Python style guide enforcement
    flake8-import-order   # Import order checking
    flake8-black          # Black code formatter integration
commands =
    # Check Python code style
    flake8  galaxychop tests {posargs}


[testenv:docstyle]
description = "Check docstring style compliance (NumPy convention)"
labels = static
deps =
    pydocstyle    # Docstring style checker
    tomli         # TOML parser for configuration
skip_install = True
commands =
    pydocstyle galaxychop --ignore-decorators=doc_inherit --convention=numpy

[testenv:check-testdir]
description = "Verify test directory structure consistency"
labels = static
skip_install = True
deps =
    https://github.com/quatrope/qafan/archive/refs/heads/master.zip
commands =
    check-testdir check tests/ --reference-dir galaxychop/ {posargs}

[testenv:check-headers]
description = "Check file headers consistency using template"
labels = static
skip_install = True
deps =
    https://github.com/quatrope/qafan/archive/refs/heads/master.zip
commands =
    check-headers check galaxychop/ tests/ --header-template .header-template {posargs}

[testenv:check-apidocsdir]
description = "Verify API documentation structure consistency"
labels = static
skip_install = True
deps =
    https://github.com/quatrope/qafan/archive/refs/heads/master.zip
commands =
    check-apidocsdir check docs/source/api/ --reference-dir galaxychop/ {posargs}


# =============================================================================
# DOCUMENTATION ENVIRONMENTS (label: docs)
# =============================================================================
# These environments handle documentation generation and verification.

[testenv:make-docs]
description = "Build HTML documentation using Sphinx"
labels = docs
usedevelop = True
skip_install = False
changedir = docs
deps =
    -r {toxinidir}/docs/requirements.txt
commands =
    # Build HTML docs with warnings as errors
    sphinx-build -W -b html -d {envtmpdir}/doctrees source {envtmpdir}/html
